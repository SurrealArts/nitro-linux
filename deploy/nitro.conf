# /etc/nitro.conf — applied on boot by nitro-apply.service (optional).
# Lines: static <zone 1|2|4|8> <r> <g> <b>
#      | dyn <mode 1-5> <speed> <bright 0-100> <dir 1-2> <r> <g> <b>
#      | fan <cpu|gpu> <0-100>
#      | profile <low-power|quiet|balanced|balanced-performance|performance>
#
# Dynamic overrides static. Comment out what you don't want.
static 1 255 255 255
static 2 255 255 255
static 4 255 255 255
static 8 255 255 255
fan cpu 50
fan gpu 50
profile balanced
