name: Publish pacman repository

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check tag matches PKGBUILD and version consistency
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(sed -n 's/^pkgver=//p' packaging/PKGBUILD | head -n1)"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "Tag v$tag_version does not match PKGBUILD pkgver $pkg_version" >&2
            exit 1
          fi
          python3 tools/check_version.py
          python3 tools/check_models.py
          python3 tools/check_install_drift.py

      - name: Build and sign package repository
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          mkdir -p public/x86_64
          docker run --rm \
            --env GPG_PRIVATE_KEY \
            --volume "$PWD:/src" \
            --workdir /src \
            archlinux:base-devel \
            bash /src/.github/scripts/build-repo.sh

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
