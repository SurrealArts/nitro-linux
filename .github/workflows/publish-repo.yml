name: Publish pacman repository

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  # Manual runs are only useful to re-publish an existing tag: select the tag
  # in the "Use workflow from" dropdown. Branch runs are skipped by the job
  # guard below.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Only semver tag refs may publish. This also blocks workflow_dispatch from a
    # branch, which would otherwise build unreviewed code with the signing key.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: release
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Verify signed tag
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          trap 'rm -rf "$GNUPGHOME"' EXIT
          # actions/checkout overwrites the tag ref with the commit; re-fetch the
          # tag object from origin so git verify-tag can inspect the signature.
          git fetch --force origin "refs/tags/${TAG_NAME}:refs/tags/${TAG_NAME}"
          shopt -s nullglob
          keys=(keys/*.asc)
          if [ "${#keys[@]}" -eq 0 ]; then
            echo "::error::no public signing key in keys/; cannot verify $TAG_NAME"
            exit 1
          fi
          gpg --batch --import "${keys[@]}"
          git verify-tag --raw "$TAG_NAME"
          test "$(git rev-parse "$TAG_NAME^{commit}")" = "$(git rev-parse HEAD)"

      - name: Check tag matches PKGBUILD and version consistency
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag_version="${TAG_NAME#v}"
          pkg_version="$(sed -n 's/^pkgver=//p' packaging/PKGBUILD | head -n1)"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "Tag $TAG_NAME does not match PKGBUILD pkgver $pkg_version" >&2
            exit 1
          fi
          python3 tools/check_version.py
          python3 tools/check_models.py
          python3 tools/check_install_drift.py

      - name: Build and sign package repository
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p public/x86_64
          docker run --rm \
            --env GPG_PRIVATE_KEY \
            --volume "$PWD:/src" \
            --workdir /src \
            archlinux:base-devel@sha256:3cbf69d2d5958d6a294f3722c5668e6187c4df8e00fa27f72352f0bf83e495e1 \
            bash /src/.github/scripts/build-repo.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
