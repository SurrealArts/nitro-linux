name: "Model Support Report"
description: "Request support for a new Acer Nitro/Predator model"
title: "[Model] <product_name> / <board_name>"
labels: ["model-support"]
body:
  - type: markdown
    attributes:
      value: |
        ## Required Information

        Please provide accurate DMI and system information. You can generate this using `nitro report` or the command below:

        ```bash
        {
          echo "[uname]"; uname -r
          echo "[DMI]"
          cat /sys/class/dmi/id/{sys_vendor,product_name,board_name,board_vendor,bios_version,bios_date}
          echo "[WMI]"; ls /sys/bus/wmi/devices/
          echo "[nitro]"; ls /sys/devices/platform/nitro/ 2>/dev/null || true
          echo "[modules]"; lsmod | grep -E 'nitro|acer_wmi' || true
        } 2>/dev/null
        ```

  - type: input
    id: product-name
    attributes:
      label: "Product Name"
      description: "From /sys/class/dmi/id/product_name"
      placeholder: "e.g., Nitro AN515-58"
    validations:
      required: true

  - type: input
    id: board-name
    attributes:
      label: "Board Name"
      description: "From /sys/class/dmi/id/board_name"
      placeholder: "e.g., Scala_TLS"
    validations:
      required: true

  - type: input
    id: bios-version
    attributes:
      label: "BIOS Version"
      description: "From /sys/class/dmi/id/bios_version"
      placeholder: "e.g., V1.22"
    validations:
      required: true

  - type: input
    id: distro-kernel
    attributes:
      label: "Distro & Kernel"
      description: "e.g., Arch Linux 6.12.1-arch1-1"
      placeholder: "Arch Linux 6.12.1-arch1-1"
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: "Install Method"
      options:
        - Package
        - Source
        - Not installed
    validations:
      required: true

  - type: textarea
    id: report-output
    attributes:
      label: "nitro report output"
      description: "Output from `nitro report` (or the bash snippet above)"
      placeholder: "Paste output here..."
    validations:
      required: true

  - type: textarea
    id: observed-behavior
    attributes:
      label: "Observed Behavior"
      description: "Fans, temperatures, keyboard backlight, platform profile, suspend/resume"
      placeholder: "Describe what you observe..."
    validations:
      required: true

  - type: textarea
    id: probe-output
    attributes:
      label: "Probe Output (optional)"
      description: "Only fill this if a maintainer has triaged your report, added a candidate probe entry, and requested probe output"
      placeholder: "sudo modprobe nitro probe=1; cat /sys/devices/platform/nitro/capabilities"
    validations:
      required: false

  - type: checkboxes
    id: safety-ack
    attributes:
      label: "Safety Acknowledgement"
      description: "You must confirm you have not done any of the following"
      options:
        - label: "I have not force-loaded the module"
          required: true
        - label: "I have not patched DMI strings"
          required: true
        - label: "I have not written raw EC/WMI registers"
          required: true
        - label: "I understand my model is unverified and probe mode is read-only"
          required: true

  - type: markdown
    attributes:
      value: |
        ## Next Steps

        Once your report is triaged, a candidate probe entry may be added in a future release. Maintainers will guide you through running `probe=1` to safely collect evidence.
