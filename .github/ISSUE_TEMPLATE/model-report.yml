name: "Model Support Report"
description: "Request support for a new Acer Nitro/Predator model"
title: "[Model] <product_name>"
labels: ["model-support"]
body:
  - type: markdown
    attributes:
      value: |
        ## Required Information

        Run `nitro report` and paste the full output below. It is read-only and redacts UUIDs and MAC addresses. If `nitro-linux` is not installed, paste this instead:

        ```bash
        {
          echo "[uname]"; uname -r
          echo "[DMI]"
          cat /sys/class/dmi/id/{sys_vendor,product_name,bios_version,bios_date}
          echo "[WMI]"; ls /sys/bus/wmi/devices/
          echo "[modules]"; lsmod | grep -E 'nitro|acer_wmi' || true
        } 2>/dev/null
        ```

  - type: input
    id: product-name
    attributes:
      label: "Product Name"
      description: "From /sys/class/dmi/id/product_name"
      placeholder: "e.g., Nitro AN515-58"
    validations:
      required: true

  - type: input
    id: distro-kernel
    attributes:
      label: "Distro & Kernel"
      description: "e.g., Arch Linux 6.12.1-arch1-1"
      placeholder: "Arch Linux 6.12.1-arch1-1"
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: "Install Method"
      options:
        - Package
        - Source
        - Not installed
    validations:
      required: true

  - type: textarea
    id: report-output
    attributes:
      label: "nitro report output"
      description: "Output from `nitro report` (or the bash snippet above)"
      placeholder: "Paste output here..."
    validations:
      required: true

  - type: textarea
    id: observed-behavior
    attributes:
      label: "Observed Behavior"
      description: "Fans, temperatures, keyboard backlight, platform profile, suspend/resume"
      placeholder: "Describe what you observe..."
    validations:
      required: true

  - type: textarea
    id: probe-output
    attributes:
      label: "Probe Output (optional)"
      description: "Only if a maintainer triaged your report, added a probe entry, and asked for it. Run `sudo python3 tools/probe_survey.py` and paste the block plus the exit code"
      placeholder: "survey block + exit code"
    validations:
      required: false

  - type: textarea
    id: acpi-output
    attributes:
      label: "ACPI table (optional)"
      description: "Only if a maintainer asked for it, when an ACPI-backed capability answers wrongly instead of being absent. Paste the `Method (WMAA ...)` block from your decompiled SSDT, or attach the `.dsl` file. See Contributing -> ACPI tables for the `acpidump` and `iasl` commands"
      placeholder: "Method (WMAA, 2, Serialized)\n{\n    ...\n}"
    validations:
      required: false

  - type: checkboxes
    id: safety-ack
    attributes:
      label: "Safety Acknowledgement"
      description: "A local DMI patch is not upstream support, but it is useful context: disclose it under Observed Behavior instead of hiding it. Do not force-load or write raw EC/WMI registers."
      options:
        - label: "I have not force-loaded the module with modprobe -f or insmod"
          required: true
        - label: "I have not written EC values or sent WMI SET calls (the read-only survey nodes do not count)"
          required: true
        - label: "I understand that a local DMI or source patch is not upstream support, and I have disclosed any such patch under Observed Behavior"
          required: true
        - label: "I understand my model is unverified, and probe mode only reads unless a maintainer asks for a same-value write-back run"
          required: true

  - type: markdown
    attributes:
      value: |
        ## Next Steps

        Once your report is triaged, a candidate probe entry may be added in a future release. Maintainers will guide you through running `probe=1` to safely collect evidence, and — if a capability is backed by an ACPI method that answers wrongly on your machine — through dumping the ACPI table that method lives in.
